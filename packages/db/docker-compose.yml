name: JURIS-OS-DB

services:
  postgres:
    image: postgres:15-alpine
    container_name: JURIS-OS-DB
    environment:
      POSTGRES_DB: JURIS-OS-DB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - JURIS-OS-DB_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  JURIS-OS-DB_postgres_data:
